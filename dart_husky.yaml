dart_husky:
  verbose: true
  staged_only: true

pre-commit:
  commands:
    format:
      run: dart format --set-exit-if-changed .
      staged_only: false
    analyze:
      run: dart analyze
    test:
      run: dart test
      staged_only: false   # always run full test suite

commit-msg:
  commands:
    conventional:
      preset: conventional
      types:
        append: [wip, release]
